ex-wrap:wrap}.title{font-size:24px}}</style></head><body><div id="auth"><div class="authbox"><div class="label">SAAS LEDGER CLOUD</div><h1 id="authTitle">Sign in</h1><p class="sub">Your application ledger, synced across devices.</p><div class="fields"><div class="field full"><label>Email</label><input id="email" type="email"></div><div class="field full"><label>Password</label><input id="password" type="password"></div></div><p id="authErr" class="red"></p><button id="authSubmit" class="btn primary" style="width:100%">Sign in</button><button id="authToggle" class="btn" style="width:100%;margin-top:7px">Create account</button></div></div><div class="shell"><header class="top"><div class="brand">SaaS Ledger<small>Application command center</small></div><div class="actions"><button class="btn" id="export">Export</button><button class="btn primary" id="capture">＋ Capture</button></div></header><div class="layout"><aside class="side"><button class="nav active" data-v="dashboard">▦ Command</button><button class="nav" data-v="phases">⚑ Roadmap</button><button class="nav" data-v="ledger">▤ Ledger</button><button class="nav" data-v="customers">◎ Customers</button><button class="nav" data-v="billing">▣ Billing</button><button class="nav" data-v="infra">☁ Infrastructure</button><button class="nav" data-v="reports">◫ Reports</button><button class="nav" data-v="settings">⚙ Settings</button></aside><main class="main"><section id="dashboard" class="view active"></section><section id="phases" class="view"></section><section id="ledger" class="view"></section><section id="customers" class="view"></section><section id="billing" class="view"></section><section id="infra" class="view"></section><section id="reports" class="view"></section><section id="settings" class="view"></section></main></div><nav class="mobile"><button data-v="dashboard">Command</button><button data-v="phases">Roadmap</button><button data-v="ledger">Ledger</button><button data-v="customers">CRM</button><button dat const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)};const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)||0);const status=s=>`<span class="badge ${s==='done'||s==='paid'||s==='active'?'green':s==='Blocked'||s==='unpaid'||s==='at-risk'?'red':'amber'}">${esc(s)}</span>`;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%"></i></div>`;
function open(title,body,save){$("sheet").innerHTML=`<div class="head"><div><b>${esc(title)}</b></div><button class="btn" data-close>×</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:7px;margin-top:12px"><button class="btn" data-close>Cancel</button><button id="modalSave" class="btn primary">Save</button></div>`;$("modal").classList.add("show");$("modalSave").onclick=save}function close(){$("modal").classList.remove("show")};document.addEventListener("click",e=>{if(e.target.matches("[data-close]"))close()});
async function auth(){const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<6){$("authErr").textContent="Enter a valid email and a 6+ character password.";return}$("authSubmit").disabled=true;const r=mode==="signin"?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password});$("authSubmit").disabled=false;if(r.error){$("authErr").textContent=r.error.message;return}if(mode==="signup"&&!r.data.session){$("authErr").textContent="Account created. Confirm your email, then sign in.";mode="signin";$("authTitle").textContent="Sign in";$("authSubmit").textContent="Sign in";return}await boot(r.data.session)}
$("authSubmit").onclick=auth;$("password").onkeydown=e=>{if(e.key==="Enter")auth()};$("authToggle").onclick=()=>{mode=mode==="signin"?"signup":"signin";$("authTitle").textContent=mode==="signin"?"Sign in":"Create account";$("authSubmit").textContent=mode==="signin"?"Sign in":"Create account";$("authToggle").textContent=mode==="signin"?"Create account":"Back to sign in"};
async function boot(session){user=session?.user;if(!user){$("auth").style.display="flex";return}const m=await SB.from("workspace_members").select("workspace_id,role").eq("user_id",user.id).limit(1);if(m.error){$("authErr").textContent=m.error.message;return}if(!m.data.length){const w=await SB.from("workspaces").insert({name:"My SaaS",created_by:user.id}).select("id").single();if(w.error){$("authErr").textContent=w.error.message;return}ws=w.data.id;const me=await SB.from("workspace_members").insert({workspace_id:ws,user_id:user.id,role:"owner"});if(me.error){$("authErr").textContent=me.error.message;return}await seed()}else ws=m.data[0].workspace_id;await load();$("auth").style.display="none";render("dashboard");toast("Cloud connected")}
async function seed(){const phases=["Idea & Validation","Product Definition","UI / UX Design","Core Build","Private Beta","Billing & Payments","Public Launch","Growth Loops","Series Seed Prep","Team Scaling"].map((name,i)=>({workspace_id:ws,phase_number:i+1,name,status:i===2||i===3?"active":i<2?"done":"upcoming",goal:`Execute ${name} with measurable outcomes.`}));const r=await SB.from("phases").insert(phases).select();if(r.error)throw r.error;data.phases=r.data;const tasks=data.phases.slice(0,4).flatMap((p,i)=>[{workspace_id:ws,phase_id:p.id,title:i<2?"Complete phase acceptance criteria":"Define and ship the next product outcome",type:"task",status:i<2?"done":"open",completed:i<2,notes:"Tracked by SaaS Ledger"}]);const t=await SB.from("work_items").insert(tasks);if(t.error)throw t.error;await SB.from("plans").insert([{workspace_id:ws,name:"Growth",price:499,currency:"USD",interval:"month",active:true,features:["Core workspace","Analytics"]},{workspace_id:ws,name:"Pro",price:999,currency:"USD",interval:"month",active:true,features:["Advanced workspace","Priority support"]}])}
async function load(){const id=ws;const [p,t,i,l,c,pl,iv]=await Promise.all([SB.from("phases").select("*").eq("workspace_id",id).order("phase_number"),SB.from("work_items").select("*").eq("workspace_id",id).eq("type","task"),SB.from("issues").select("*").eq("workspace_id",id).order("created_at",{ascending:false}),SB.from("activity_log").select("*").eq("workspace_id",id).order("created_at",{ascending:false}).limit(100),SB.from("customers").select("*").eq("workspace_id",id),SB.from("plans").select("*").eq("workspace_id",id),SB.from("invoices").select("*").eq("workspace_id",id).order("created_at",{ascending:false})]);for(const x of [p,t,i,l,c,pl,iv])if(x.error)throw x.error;data={phases:p.data||[],tasks:t.data||[],issues:i.data||[],ledger:l.data||[],customers:c.data||[],plans:pl.data||[],invoices:iv.data||[]};phaseId=data.phases.find(p=>p.status==="active")?.id||data.phases[0]?.id}
async function write(table,row){const r=await SB.from(table).insert({...row,workspace_id:ws}).select().single();if(r.error)throw r.error;return r.data}async function update(table,id,row){const r=await SB.from(table).update(row).eq("id",id).eq("workspace_id",ws);if(r.error)throw r.error}
function render(v=view){view=v;document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("active",x.dataset.v===v));if(v==="dashboard")dashboard();if(v==="phases")phases();if(v==="ledger")ledger();if(v==="customers")customers();if(v==="billing")billing();if(v==="infra")infra();if(v==="reports")reports();if(v==="settings")settings()}
document.addEventListener("click",e=>{const n=e.target.closest("[data-v]");if(n)render(n.dataset.v)});
function dashboard(){const active=data.phases.find(p=>p.id===phaseId)||data.phases[0];const total=data.tasks.length,done=data.tasks.filter(x=>x.completed).length,blocked=data.issues.filter(x=>x.status!=="Resolved").length,mrr=data.customers.reduce((a,x)=>a+Number(x.mrr||0),0);$("dashboard").innerHTML=`<div class="head"><div><h1 class="title">Command Center</h1><div class="sub">Your SaaS operating system — product, customers, money and infrastructure.</div></div></div><div class="grid g4"><div class="card"><div class="label">Build progress</div><div class="value">${total?Math.round(done/total*100):0}%</div>${bar(total?done/total*100:0)}<div class="muted">${done}/${total} tasks</div></div><div class="card"><div class="label">MRR</div><div class="value">${money(mrr)}</div><div class="green">Live from customers</div></div><div class="card"><div class="label">Customers</div><div class="value">${data.customers.length}</div><div class="muted">Cloud synced</div></div><div class="card"><div class="label">Open issues</div><div class="value ${blocked?'red':''}">${blocked}</div><div class="muted">Requires attention</div></div></div><div style="margin:20px 0 10px"><b>Active phase</b></div><div class="card"><div class="label">PHASE ${active?.phase_number||"—"}</div><h2>${esc(active?.name||"No phase")}</h2><p class="sub">${esc(active?.goal||"")}</p>${bar(active?.status==="done"?100:50)}<div class="actions" style="margin-top:12px"><button class="btn primary" data-v="phases">Open roadmap</button><button class="btn" id="dashCapture">＋ Capture</button></div></div><div style="margin:20px 0 10px"><b>Recent ledger</b></div><div class="list">${data.ledger.slice(0,5).map(x=>`<div class="item"><span class="badge">${esc(x.entity_type||"event")}</span><div class="grow">${esc(x.description||x.action)}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></div></div>`).join("")||'<div class="card muted">No activity yet.</div>'}</div>`;$('dashCapture').onclick=()=>capture()}
function phases(){if(!phaseId||!data.phases.find(p=>p.id===phaseId)){phaseId=data.phases[0]?.id}const p=data.phases.find(p=>p.id===phaseId);$("phases").innerHTML=`<div class="head"><div><h1 class="title">Roadmap</h1><div class="sub">Every lifecycle phase with tasks and blockers.</div></div><button class="btn primary" id="newPhase">＋ Phase</button></div><div class="grid g2">${data.phases.map(p=>`<div class="card" style="cursor:pointer;border-color:${p.id===phaseId?'#777':'#202327'}" data-phase="${p.id}"><div style="display:flex;justify-content:space-between"><span class="badge">${String(p.phase_number).padStart(2,'0')}</span>${status(p.status)}</div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.goal||'')}</div><div style="margin-top:10px">${bar(p.status==='done'?100:p.status==='active'?50:0)}</div><div class="muted" style="margin-top:6px">${data.tasks.filter(t=>t.phase_id===p.id&&t.completed).length}/${data.tasks.filter(t=>t.phase_id===p.id).length} tasks complete</div></div>`).join("")}</div><div style="margin:20px 0 10px"><b>Phase workspace</b></div><div class="card">${p?`<div class="actions"><button class="btn primary" id="addTask">＋ Task</button><button class="btn" id="addIssue">＋ Issue</button></div><div class="list" style="margin-top:12px">${data.tasks.filter(t=>t.phase_id===p.id).map(t=>`<div class="item"><button class="btn" data-task="${t.id}">${t.completed?'✓':'○'}</button><div class="grow"><b>${esc(t.title)}</b><div class="muted">${esc(t.notes||'')}</div></div></div>`).join("")||'<div class="muted">No tasks.</div>'}</div><div style="margin-top:15px"><b>Issues</b></div><div class="list" style="margin-top:8px">${data.issues.filter(i=>i.work_item_id==null||data.tasks.some(t=>t.id===i.work_item_id&&t.phase_id===p.id)).map(i=>`<div class="item"><span class="badge red">${esc(i.severity)}</span><div class="grow"><b>${esc(i.title)}</b><div class="muted">${esc(i.description)}</div></div>${i.status!=="Resolved"?`<button class="btn" data-issue="${i.id}">Resolve</button>`:''}</div>`).join("")||'<div class="muted">No issues.</div>'}</div>`:'No phase selected'}</div>`;document.querySelectorAll("[data-phase]").forEach(x=>x.onclick=()=>{phaseId=x.dataset.phase;phases()});$("newPhase").onclick=()=>phaseForm();$("addTask")?.addEventListener("click",()=>taskForm(p.id));$("addIssue")?.addEventListener("click",()=>issueForm(p.id));document.querySelectorAll("[data-task]").forEach(x=>x.onclick=async()=>{const t=data.tasks.find(t=>t.id===x.dataset.task);await update("work_items",t.id,{completed:!t.completed,status:t.completed?"open":"done"});await load();phases();toast("Task updated")});document.querySelectorAll("[data-issue]").forEach(x=>x.onclick=async()=>{await update("issues",x.dataset.issue,{status:"Resolved",resolved_at:new Date().toISOString()});await load();phases();toast("Issue resolved")})}
function taskForm(pid){open("Add task",`<div class="fields"><div class="field full"><label>Task</label><input id="f1"></div><div class="field full"><label>Note</label><input id="f2"></div></div>`,async()=>{if(!$("f1").value.trim())return toast("Task required");await write("work_items",{phase_id:pid,title:$("f1").value.trim(),type:"task",status:"open",completed:false,notes:$("f2").value.trim()});await load();close();phases();toast("Task added")})}function issueForm(pid){open("Add issue",`<div class="fields"><div class="field"><label>Severity</label><select id="f1"><option>P0</option><option>High</option><option>Normal</option></select></div><div class="field"><label>Status</label><select id="f2"><option>Open</option><option>Blocked</option></select></div><div class="field full"><label>Title</label><input id="f3"></div><div class="field full"><label>Description</label><textarea id="f4"></textarea></div></div>`,async()=>{if(!$("f3").value.trim())return toast("Issue title required");const wi=await write("work_items",{phase_id:pid,title:$("f3").value.trim(),type:"issue",status:$("f2").value,priority:$("f1").value,completed:false,notes:$("f4").value.trim()});await write("issues",{work_item_id:wi.id,title:$("f3").value.trim(),description:$("f4").value.trim(),severity:$("f1").value,status:$("f2").value});await load();close();phases();toast("Issue added")})}function phaseForm(){open("New phase",`<div class="fields"><div class="field"><label>Number</label><input id="f1" type="number" value="${data.phases.length+1}"></div><div class="field"><label>Status</label><select id="f2"><option>upcoming</option><option>active</option><option>done</option></select></div><div class="field full"><label>Name</label><input id="f3"></div><div class="field full"><label>Goal</label><textarea id="f4"></textarea></div></div>`,async()=>{if(!$("f3").value.trim())return toast("Phase name required");await write("phases",{phase_number:Number($("f1").value),name:$("f3").value.trim(),status:$("f2").valu function capture(){open("Quick capture",`<div class="fields"><div class="field"><label>Type</label><select id="f1"><option>decision</option><option>learning</option><option>issue</option><option>experiment</option><option>invoice</option><option>snapshot</option></select></div><div class="field full"><label>Entry</label><textarea id="f2"></textarea></div></div>`,async()=>{if(!$("f2").value.trim())return toast("Entry required");await write("activity_log",{action:"capture",entity_type:$("f1").value,description:$("f2").value.trim()});await load();close();ledger();toast("Ledger entry saved")})}
function customers(){ $("customers").innerHTML=`<div class="head"><div><h1 class="title">Customers</h1><div class="sub">Accounts and recurring revenue.</div></div><button class="btn primary" id="nc">＋ Customer</button></div><div class="scroll"><table class="table"><thead><tr><th>Account</th><th>Plan</th><th>MRR</th><th>Status</th><th></th></tr></thead><tbody>${data.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.plan||'')}</td><td>${money(c.mrr)}</td><td>${status(c.status)}</td><td><button class="btn danger" data-c="${c.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;$("nc").onclick=customerForm;document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const r=await SB.from("customers").delete().eq("id",b.dataset.c).eq("workspace_id",ws);if(r.error)return toast(r.error.message);await load();customers();toast("Customer removed")})}function customerForm(){open("Add customer",`<div class="fields"><div class="field"><label>Name</label><input id="f1"></div><div class="field"><label>Plan</label><input id="f2"></div><div class="field"><label>MRR</label><input id="f3" type="number"></div><div class="field"><label>Health</label><select id="f4"><option>healthy</option><option>at-risk</option></select></div></div>`,async()=>{if(!$("f1").value.trim())return toast("Name required");await write("customers",{name:$("f1").value.trim(),plan:$("f2").value.trim(),mrr:Number($("f3").value)||0,status:"active",notes:$("f4").value});await load();close();customers();toast("Customer added")})}
function billing(){$("billing").innerHTML=`<div class="head"><div><h1 class="title">Billing & Payments</h1><div class="sub">Plans, invoices and payment state.</div></div><button class="btn primary" id="ni">＋ Invoice</button></div><div class="grid g3">${data.plans.map(p=>`<div class="card"><div class="label">${esc(p.name)}</div><div class="value">${money(p.price)}</div><div class="muted">${Array.isArray(p.features)?p.features.join(', '):''}</div></div>`).join("")}</div><div style="margin:20px 0 10px"><b>Invoices</b></div><div class="scroll"><table class="table"><thead><tr><th>Invoice</th><th>Amount</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>${data.invoices.map(i=>`<tr><td>${esc(i.invoice_number)}</td><td>${money(i.amount)}</td><td>${status(i.status)}</td><td>${esc(i.due_date||'')}</td><td><button class="btn" data-i="${i.id}">Toggle</button></td></tr>`).join("")}</tbody></table></div>`;$("ni").onclick=invoiceForm;document.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{const i=data.invoices.find(x=>x.id===b.dataset.i);await update("invoices",i.id,{status:i.status==='paid'?'unpaid':'paid',paid_at:i.status==='paid'?null:new Date().toISOString().slice(0,10)});await load();billing();toast("Invoice updated")})}function invoiceForm(){open("New invoice",`<div class="fields"><div class="field"><label>Invoice number</label><input id="f1" value="INV-${Date.now()}"></div><div class="field"><label>Customer ID</label><input id="f2"></div><div class="field"><label>Amount</label><input id="f3" type="number"></div><div class="field"><label>Due date</label><input id="f4" type="date"></div></div>`,async()=>{await write("invoices",{invoice_number:$("f1").value,customer_id:$("f2").value||null,amount:Number($("f3").value)||0,currency:"USD",status:"unpaid",due_date:$("f4").value});await load();close();billing();toast("Invoice created")})}
function infra(){$("infra").innerHTML=`<div class="head"><div><h1 class="title">Infrastructure</h1><div class="sub">Production readiness and storage.</div></div></div><div class="grid g3"><div class="card"><div class="label">Database</div><div class="value">Postgres</div><div class="green">Connected</div></div><div class="card"><div class="label">Auth</div><div class="value">Supabase</div><div class="green">Connected</div></div><div class="card"><div class="label">Hosting</div><div class="value">Render</div><div class="green">Deployment target</div></div></div><div style="margin:20px 0 10px"><b>Production checklist</b></div><div class="grid g2">${['Tenant isolation / RLS','Authentication','Database schema','Object storage','Payment webhooks','Backups','Observability','Rate limiting'].map((x,i)=>`<div class="item"><span class="badge ${i<3?'green':'amber'}">${i<3?'READY':'OPEN'}</span><div class="grow"><b>${x}</b><div class="muted">${i<3?'Implemented in current stack':'Next production integration'}</div></div></div>`).join('')}</div>`}function reports(){$("reports").innerHTML=`<div class="head"><div><h1 class="title">Reports</h1><div class="sub">Live snapshot from cloud data.</div></div><button class="btn primary" id="re">Export JSON</button></div><div class="grid g4"><div class="card"><div class="label">Phases</div><div class="value">${data.phases.length}</div></div><div class="card"><div class="label">Tasks</div><div class="value">${data.tasks.length}</div></div><div class="card"><div class="label">Issues</div><div class="value">${data.issues.filter(i=>i.status!=='Resolved').length}</div></div><div class="card"><div class="label">MRR</div><div class="value">${money(data.customers.reduce((a,c)=>a+Number(c.mrr||0),0))}</div></div></div>`;$("re").onclick=exportData}function settings(){$("settings").innerHTML=`<div class="head"><div><h1 class="title">Settings</h1><div class="sub">Account and data controls.</div></div></div><div class="card"><b>${esc(user?.email||'')}</b><p class="muted">Workspace: ${esc(ws||'')}</p><button class="btn" id="out">Sign out</button><button class="btn" id="imp">Import backup</button></div>`;$("out").onclick=()=>SB.auth.signOut();$("imp").onclick=()=>$("import").click()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='saas-ledger-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$("export").onclick=exportData;$("import").onchange=async e=>{try{JSON.parse(await e.target.files[0].text());toast('Backup file validated — merge through cloud CRUD')}catch{toast('Invalid backup')}};SB.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){user=null;ws=null;$("auth").style.display='flex'}});SB.auth.getSession().then(x=>boot(x.data.session)).catch(e=>{$("authErr").textContent=e.message});
</script></body></html>
